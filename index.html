<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>日本旅遊小幫手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
            -webkit-tap-highlight-color: transparent;
        }

        /* 模擬手機外框 */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #f8fafc; /* bg-slate-50 */
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 隱藏滾動條但保留滾動功能 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 點擊特效 */
        .active-scale:active {
            transform: scale(0.97);
            transition: transform 0.1s;
        }

        /* 播放動畫 */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .playing-icon {
            position: relative;
            color: #ef4444; /* red-500 */
        }
        .playing-icon::after {
            content: '';
            position: absolute;
            left: 0; top: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background-color: #ef4444;
            animation: pulse-ring 1s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            z-index: -1;
        }

        /* 漢字注音 (Furigana) 樣式 */
        ruby {
            ruby-align: center;
        }
        rt {
            font-size: 0.55em;
            color: #e11d48; /* 改為更具質感的玫瑰紅 (rose-600) */
            font-weight: 600;
            transform: translateY(-1px);
        }

        /* 介面進場動畫 */
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fade-in-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; /* 初始隱藏，靠動畫顯示 */
        }
    </style>
</head>

            </div>

        // DOM 元素
        const homeView = document.getElementById('homeView');
        const phraseView = document.getElementById('phraseView');
        const categoryGrid = document.getElementById('categoryGrid');
        const phraseList = document.getElementById('phraseList');
        const headerTitle = document.getElementById('headerTitle');
        const backBtn = document.getElementById('backBtn');

        let currentSpeakingBtn = null;

        // 初始化
        function init() {
            renderCategories();
            
            // 預載語音 (處理某些瀏覽器需要時間加載聲音的問題)
            if (window.speechSynthesis) {
                window.speechSynthesis.onvoiceschanged = function() {
                    window.speechSynthesis.getVoices();
                };
            }
        }

        
        // 渲染主頁分類卡片 (增加進場動畫與細節陰影)
        function renderCategories() {
            categoryGrid.innerHTML = '';
            let delayIndex = 0;
            for (const key in appData) {
                const cat = appData[key];
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm hover:shadow-md border border-gray-100 p-2.5 flex flex-col items-center justify-center gap-1.5 active-scale cursor-pointer transition-all animate-fade-in";
                card.style.animationDelay = `${delayIndex * 0.05}s`; // 錯開動畫時間，產生瀑布流效果
                card.onclick = () => openCategory(key);
                
                card.innerHTML = `
                    <div class="w-8 h-8 rounded-full ${cat.color} text-white flex items-center justify-center text-sm shadow-sm">
                        <i class="${cat.icon}"></i>
                    </div>
                    <span class="font-bold text-gray-700 text-[0.75rem] tracking-wide">${cat.title}</span>
                `;
                categoryGrid.appendChild(card);
                delayIndex++;
            }
        }

        // 打開特定分類
        function openCategory(key) {
            const cat = appData[key];
            
            // 更新 Header
            headerTitle.innerText = cat.title;
            backBtn.classList.remove('hidden');
            
            // 切換視圖
            homeView.classList.add('hidden');
            phraseView.classList.remove('hidden');
            
            // 判斷分類類型 (對話列表 或 實用網站連結)
            if (cat.type === 'links') {
                renderLinks(cat.items);
            } else {
                renderPhrases(cat.phrases);
            }
            
            // 滾動到頂部
            document.getElementById('mainContent').scrollTop = 0;
        }

        // 返回主頁
        function goBack() {
            // 停止正在播放的聲音
            if(window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            resetPlayButtons();

            headerTitle.innerText = "日本旅遊小幫手 🇯🇵";
            backBtn.classList.add('hidden');
            
            phraseView.classList.add('hidden');
            homeView.classList.remove('hidden');
            
            // 返回主頁時重新觸發動畫
            renderCategories();
        }

        // 渲染句子列表 (加入動畫與介面升級)
        function renderPhrases(phrases) {
            phraseList.innerHTML = '';
            phrases.forEach((phrase, index) => {
                const container = document.createElement('div');
                container.className = "flex flex-col mb-4 animate-fade-in"; // 外層間距縮小
                container.style.animationDelay = `${index * 0.08}s`; 
                
                // 1. 渲染情境說明
                if (phrase.situation) {
                    const sitDiv = document.createElement('div');
                    sitDiv.className = "text-xs text-gray-500 mb-2 mt-2 px-1 flex items-center gap-1.5 font-bold tracking-wide";
                    sitDiv.innerHTML = `<i class="fa-solid fa-map-pin text-rose-500"></i> ${phrase.situation}`;
                    container.appendChild(sitDiv);
                }

                // 2. 渲染店員/對方的對話
                if (phrase.clerk) {
                    const clerkDiv = document.createElement('div');
                    clerkDiv.className = "flex items-start gap-2 mb-2.5 w-full pr-4";
                    clerkDiv.innerHTML = `
                        <div class="w-7 h-7 rounded-full bg-slate-200 flex items-center justify-center flex-shrink-0 text-slate-600 text-xs shadow-sm mt-0.5 border border-slate-300">
                            <i class="fa-solid fa-user-tie"></i>
                        </div>
                        <div class="bg-slate-100 border border-slate-200 shadow-sm rounded-2xl rounded-tl-sm px-3 py-2 text-sm">
                            <div class="font-bold mb-0.5 text-[0.95rem] text-slate-800">${phrase.clerk.ruby || phrase.clerk.ja}</div>
                            <div class="text-[0.7rem] text-slate-500 font-medium">${phrase.clerk.zh}</div>
                        </div>
                    `;
                    container.appendChild(clerkDiv);
                }

                // 3. 渲染用戶要說的句子卡片 
                const card = document.createElement('div');
                
                let extraClass = "bg-white border-gray-200"; 
                if (phrase.isReply || phrase.clerk) {
                    if (phrase.intent === 'positive') {
                        extraClass = "bg-emerald-50 border-emerald-200 shadow-emerald-100/50"; 
                    } else if (phrase.intent === 'negative') {
                        extraClass = "bg-rose-50 border-rose-200 shadow-rose-100/50";   
                    } else {
                        extraClass = "bg-blue-50 border-blue-200 shadow-blue-100/50";    
                    }
                }
                
                card.className = `rounded-2xl shadow-sm border p-3.5 flex items-center justify-between ${extraClass}`;
                
                const textDiv = document.createElement('div');
                textDiv.className = "flex-1 pr-3";
                textDiv.innerHTML = `
                    <h3 class="text-xs text-gray-600 mb-1 font-bold">${phrase.zh}</h3>
                    <p class="text-[1.05rem] font-bold text-gray-900 mb-1.5 leading-relaxed tracking-wide">${phrase.ruby || phrase.ja}</p>
                    <p class="text-[0.65rem] text-gray-400 font-mono tracking-widest uppercase">${phrase.romaji}</p>
                `;
                
                const playBtn = document.createElement('button');
                playBtn.className = "w-9 h-9 rounded-full bg-red-100 text-red-500 flex items-center justify-center text-base flex-shrink-0 active-scale transition-colors shadow-sm border border-red-200";
                playBtn.innerHTML = `<i class="fa-solid fa-volume-high"></i>`;
                playBtn.onclick = (e) => {
                    playSpeech(phrase.ja, playBtn);
                };
                
                card.appendChild(textDiv);
                card.appendChild(playBtn);
                container.appendChild(card);
                
                phraseList.appendChild(container);
            });
        }

        // 渲染實用網站連結清單 (加入動畫)
        function renderLinks(items) {
            phraseList.innerHTML = '';
            
            const header = document.createElement('div');
            header.className = "mb-4 text-xs text-amber-800 px-1 bg-amber-50 p-3.5 rounded-xl border border-amber-200 animate-fade-in font-medium";
            header.innerHTML = "<p>點擊以下卡片將自動跳轉至相關網站，為您的日本旅行提供幫助（需網路連線）：</p>";
            phraseList.appendChild(header);

            items.forEach((item, index) => {
                const card = document.createElement('a');
                card.href = item.url;
                card.target = "_blank"; 
                card.rel = "noopener noreferrer";
                card.className = "bg-white rounded-xl shadow-sm border border-gray-200 p-3.5 flex items-center gap-3 active-scale transition-shadow hover:shadow-md mb-3 no-underline block animate-fade-in";
                card.style.animationDelay = `${(index + 1) * 0.08}s`;
                
                card.innerHTML = `
                    <div class="w-10 h-10 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-base flex-shrink-0 border border-amber-200">
                        <i class="${item.icon}"></i>
                    </div>
                    <div class="flex-1 pr-2">
                        <h3 class="text-sm font-bold text-gray-800 mb-0.5">${item.title}</h3>
                        <p class="text-[0.7rem] text-gray-500 leading-relaxed">${item.desc}</p>
                    </div>
                    <div class="text-gray-300 text-sm">
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                `;
                phraseList.appendChild(card);
            });
        }

        // 播放日語語音
        function playSpeech(text, btnElement) {
            // 檢查瀏覽器是否支援
            if (!('speechSynthesis' in window)) {
                alert("很抱歉，您的瀏覽器不支援語音播放功能。");
                return;
            }

            // 停止目前的播放
            window.speechSynthesis.cancel();
            resetPlayButtons();

            // 建立語音實例
            const msg = new SpeechSynthesisUtterance();
            msg.text = text;
            msg.lang = 'ja-JP'; // 設定語言為日文
            msg.rate = 0.9; // 稍微放慢語速，讓外國人聽得更清楚
            msg.pitch = 1.0;

            // 嘗試尋找並設定日語女聲或男聲 (依系統而定)
            const voices = window.speechSynthesis.getVoices();
            const jpVoice = voices.find(voice => voice.lang === 'ja-JP' || voice.lang === 'ja_JP');
            if (jpVoice) {
                msg.voice = jpVoice;
            }

            // 播放事件監聽：開始播放時改變按鈕樣式
            msg.onstart = function() {
                currentSpeakingBtn = btnElement;
                btnElement.classList.remove('bg-red-50', 'text-red-500');
                btnElement.classList.add('bg-red-100', 'playing-icon');
            };

            // 播放結束時恢復按鈕樣式
            msg.onend = function() {
                resetPlayButtons();
            };
            
            // 發生錯誤時
            msg.onerror = function(event) {
                console.error('Speech synthesis error', event);
                resetPlayButtons();
            };

            // 開始播放
            window.speechSynthesis.speak(msg);
        }

        // 重置所有播放按鈕的狀態
        function resetPlayButtons() {
            if (currentSpeakingBtn) {
                currentSpeakingBtn.classList.add('bg-red-50', 'text-red-500');
                currentSpeakingBtn.classList.remove('bg-red-100', 'playing-icon');
                currentSpeakingBtn = null;
            }
        }

        // 啟動應用
        init();

    </script>
</body>
</html>
